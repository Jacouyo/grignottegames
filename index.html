<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grignotte Games</title>
<style>
  :root { --encre:#14161a; --vert:#a4d21c; --gris:#5c6470; --fond:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --encre:#f2f4f6; --gris:#9aa3af; --fond:#14161a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--fond); color:var(--encre); padding:32px;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; text-align:center; }
  picture, img { display:block; width:100%; max-width:440px; height:auto; margin:0 auto; }
  nav { margin-top:40px; }
  nav a { color:var(--encre); text-decoration:none; border-bottom:2px solid var(--vert);
          padding-bottom:2px; margin:0 14px; display:inline-block; }
  nav a:hover { color:var(--vert); }
  footer { margin-top:56px; font-size:13px; color:var(--gris); }
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="logo-sombre.png" media="(prefers-color-scheme: dark)">
    <img src="logo.png" alt="Grignotte Games">
  </picture>
  <nav>
    <a href="confidentialite.html">Politique de confidentialité</a>
    <a href="mailto:contact@grignottegames.com">contact@grignottegames.com</a>
  </nav>
  <footer>Grignotte Games — France</footer>
</main>
</body>
</html>
